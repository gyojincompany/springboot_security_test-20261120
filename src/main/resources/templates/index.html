<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>대문 페이지</title>
</head>
<body>
	<h2>첫 대문 페이지</h2>
	<hr>	
	
	<!-- 로그인 여부 확인 -->
	
	<!-- 로그인하지 않았을때 보이는 코드 -->
	<div sec:authorize="isAnonymous()">
		<a th:href="@{/login}">로그인 으로 이동하기</a>
	</div>
	
	<!-- 로그인했을때 보이는 코드 -->
	<div sec:authorize="isAuthenticated()">
		<a th:href="@{/logout}">로그아웃 으로 이동하기</a>
	</div>
	
	<!-- 관리자 페이지->관리자로 로그인했을때만 보이는 메뉴 -->
	<div sec:authorize="hasRole('ADMIN')">
		<a th:href="@{/admin}">관리자 메뉴(관리자만 보임)</a>
	</div>
</body>
</html>
